<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex Usage Bar · 화면 설계</title>
<style>
:root{color-scheme:light;--text:#242631;--muted:#626572;--line:#21233718;--surface:#f6f5fbeF;--track:#27283d12;--card:#ffffff65;--accent:#6253d9;--good:#15795e;--warn:#9c630a;--bad:#b23945}
*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:var(--text);background:#e8e8ee}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9986f9;outline-offset:3px}button{border:0}button:disabled{cursor:default;opacity:.6}
.workspace{color:var(--text);min-height:100vh;background:radial-gradient(ellipse at 65% 25%,#b6abe4 0,transparent 45%),radial-gradient(ellipse at 0% 95%,#ddd0dd 0,transparent 45%),linear-gradient(140deg,#afb5c6,#d4d1e2 70%);padding-bottom:32px}.systembar{color:#242631;height:35px;background:#ffffff63;backdrop-filter:blur(25px);display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px}.sysleft{display:flex;gap:20px;align-items:center}.sysright{display:flex;align-items:center;gap:16px}.barbutton{height:29px;padding:0 9px;border-radius:6px;background:#ffffff78;font-size:12px;font-weight:600;position:relative}.minimeter{display:inline-flex;flex-direction:column;gap:3px;width:17px;vertical-align:middle;margin-right:5px}.minimeter span{height:3px;background:#504889;border-radius:2px}.minimeter span:last-child{width:61%}.badge{position:absolute;right:2px;top:3px;width:6px;height:6px;border-radius:50%;background:#bc7d27}
.intro{color:#242631;max-width:1000px;margin:30px auto 20px;padding:0 24px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.eyebrow{color:#56516f;font-size:11px;letter-spacing:1.5px;font-weight:700;text-transform:uppercase}h1{margin:8px 0;font-size:25px;letter-spacing:-.7px}.intro p{margin:0;color:#5f5c70;font-size:13px;line-height:1.6}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tools button,.tools select{color:#242631;color-scheme:light;background:#ffffff86;border:1px solid #ffffffa0;border-radius:8px;padding:8px 10px}.stage{display:flex;justify-content:center;padding:0 12px}.popover{width:420px;max-width:100%;background:var(--surface);border:1px solid #ffffffb8;border-radius:16px;box-shadow:0 20px 70px #2d244338,0 2px 8px #2521391a;backdrop-filter:blur(38px);overflow:hidden}.head{padding:19px 20px 14px}.brandrow{display:flex;justify-content:space-between;align-items:center}.brand{font-size:18px;font-weight:700;letter-spacing:-.4px;display:flex;align-items:center;gap:9px}.brandmark{width:27px;height:27px;display:grid;place-items:center;background:var(--text);color:var(--surface);border-radius:8px;font-size:15px;font-weight:500}.refresh{background:var(--track);border-radius:7px;padding:6px 9px;color:var(--muted);font-size:12px}.tabs{display:flex;gap:3px;padding:4px;background:var(--track);margin-top:16px;border-radius:9px;overflow:auto}.tab{padding:8px 3px;background:transparent;border-radius:6px;font-size:12px;flex:1;min-width:49px;white-space:nowrap;color:var(--muted)}.tab.active{background:var(--accent);color:white;box-shadow:0 2px 5px #30225623}.body{padding:0 16px 14px;max-height:455px;overflow:auto}.summary{font-size:12px;color:var(--muted);padding:0 4px 12px;display:flex;justify-content:space-between;gap:10px}.accountcard{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:8px;padding:11px 12px;cursor:pointer}.accountcard:hover{border-color:#998bc780}.cardtitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.cardtitle strong{font-size:14px}.cardmeta{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--muted)}.status{font-size:11px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}.status:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.ok{color:var(--good)}.warning{color:var(--warn)}.error{color:var(--bad)}.meterline{display:grid;grid-template-columns:35px 1fr 60px;align-items:center;gap:8px;margin-top:7px;font-size:11px;color:var(--muted)}.meterline .value{text-align:right;font-weight:600;color:var(--text)}.track{height:5px;border-radius:8px;background:var(--track);overflow:hidden}.fill{height:100%;border-radius:8px;background:var(--accent)}.fill.high{background:#c18025}.fill.full{background:#c84e5b}.resetline{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--muted);padding-left:43px}.note{font-size:12px;line-height:1.7;color:var(--muted);margin:4px 0}.note.error{color:var(--bad)}.footer{border-top:1px solid var(--line);padding:8px 13px 10px}.footerrow{display:flex;justify-content:space-between;gap:10px}.action{background:transparent;padding:8px 7px;text-align:left;font-size:12px;color:var(--text);border-radius:6px}.action:hover{background:var(--track)}.secondary{color:var(--muted)}.detailhead{padding:0 4px 16px}.detailtitle{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:650}.plan{font-size:11px;padding:4px 7px;background:var(--track);border-radius:5px;color:var(--muted)}.identity{font-size:12px;color:var(--muted);margin:7px 0;overflow-wrap:anywhere}.detailstate{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}.window{padding:15px 4px;border-top:1px solid var(--line)}.windowtitle{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:14px;font-weight:650}.windowtitle strong{font-size:22px;letter-spacing:-.8px}.window .track{height:7px}.windowdata{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:var(--muted)}.absolute{font-size:11px;color:var(--muted);margin-top:6px;text-align:right}.activity{border-top:1px solid var(--line);padding:16px 4px 5px}.activitytitle{font-size:13px;font-weight:650}.total{font-size:24px;font-weight:650;letter-spacing:-.7px;margin:8px 0 3px}.total span{font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0}.activitybars{display:flex;align-items:flex-end;height:42px;gap:7px;margin-top:13px}.activitybars span{flex:1;background:#8676dc55;border-radius:3px 3px 0 0}.chartlabels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:5px}.banner{margin:0 4px 12px;padding:10px;background:#b5731410;border:1px solid #b5731426;border-radius:8px;color:var(--warn);font-size:12px;line-height:1.5}.empty{text-align:center;padding:45px 8px;color:var(--muted);line-height:1.8}.settingrow{padding:12px 4px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px}.settingrow select{max-width:150px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px}.settingrow button{background:var(--track);padding:5px 8px;border-radius:6px;font-size:11px}.manage{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.managedname{flex:1;min-width:65px}.dialogback{position:fixed;inset:0;background:#20193755;display:grid;place-items:center;padding:24px;z-index:10}.dialogback[hidden]{display:none}.dialog{width:340px;max-width:100%;padding:24px;background:var(--surface);border-radius:15px;box-shadow:0 20px 60px #16112744}.dialog h2{font-size:18px;margin:0 0 10px}.dialog p{font-size:12px;color:var(--muted);line-height:1.7}.dialog label{display:block;font-size:12px;margin:16px 0 6px}.dialog input{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);padding:10px;border-radius:7px}.dialogactions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.dialogactions button{padding:8px 12px;border-radius:7px;background:var(--track)}.dialogactions .primary{background:var(--accent);color:#fff}.toast{font-size:11px;color:var(--muted);padding:0 20px 10px;min-height:22px}.dark{color-scheme:dark;--text:#ececf4;--muted:#a6a4b6;--line:#eeeeff16;--surface:#282736f5;--track:#d1d1ff13;--card:#ffffff05;--accent:#8a79ea;--good:#83c9b2;--warn:#e4b362;--bad:#f195a0}.dark .popover{border-color:#ffffff24}.dark .brandmark{color:#242330}.dark .fill.high{background:#cf9844}.dark .fill.full{background:#dc7c8a}@media(max-width:650px){.intro{display:block;margin:22px auto}.tools{margin-top:14px}.sysleft span:not(:first-child),.sysright>span{display:none}.systembar{padding:0 12px}.body{max-height:455px}}@media(prefers-reduced-motion:no-preference){.fill{transition:width .2s ease}}
</style>
</head>
<body>
<div class="workspace" id="demo">
  <div class="systembar"><div class="sysleft"><b>●</b><b>Finder</b><span>파일</span><span>편집</span><span>보기</span></div><div class="sysright"><button class="barbutton" id="bar-toggle" aria-label="Codex 사용량 팝오버 닫기" aria-expanded="true"><span class="minimeter"><span></span><span></span></span><span id="bar-label">5h 32% · W 61%</span><span class="badge"></span></button><span>Wi-Fi</span><span>100%</span><span>9월 16일 (수) 17:00</span></div></div>
  <div class="intro"><div><div class="eyebrow">macOS menu bar · design preview</div><h1>Codex Usage Bar</h1><p>계정 4개를 한곳에서 확인하는 화면 시안 · 모든 값은 샘플입니다.</p></div><div class="tools"><button id="theme">다크 모드</button><select id="scenario" aria-label="샘플 상태 선택"><option value="mixed">기본: 재인증 1개</option><option value="ok">모두 정상</option><option value="stale">연구 계정 조회 실패</option><option value="reset">개인 계정 리셋 확인 중</option><option value="empty">등록 계정 없음</option></select></div></div>
  <div class="stage"><section class="popover" id="popover" aria-label="Codex 사용량"><div class="head"><div class="brandrow"><div class="brand"><span class="brandmark" aria-hidden="true">⌘</span>Codex</div><button class="refresh" id="refresh">↻ 새로고침</button></div><nav class="tabs" id="tabs" aria-label="계정 선택"></nav></div><div class="body" id="content"></div><div class="toast" id="toast" role="status"></div><div class="footer"><div class="footerrow"><button class="action" id="add">＋ 계정 추가</button><button class="action" id="manage">계정 관리</button></div><div class="footerrow"><button class="action secondary" id="status">OpenAI 상태 페이지 ↗</button><button class="action secondary" id="settings">설정…</button></div></div></section></div>
</div>
<div class="dialogback" id="dialog" hidden><form class="dialog" id="addform" role="dialog" aria-modal="true" aria-labelledby="add-title"><h2 id="add-title">샘플 계정 추가</h2><p>이 목업에서는 로그인 대신 가상 계정을 추가합니다. 실제 앱에서는 브라우저 로그인 후 계정 정보를 확인합니다.</p><label for="alias">계정 별칭</label><input id="alias" required maxlength="16" placeholder="예: 개인 2" autocomplete="off"><div class="dialogactions"><button type="button" id="cancel">취소</button><button class="primary" type="submit">샘플 추가</button></div></form></div>
<script>
(() => {
 const root=document.getElementById('demo'),content=document.getElementById('content'),tabs=document.getElementById('tabs'),toast=document.getElementById('toast');
 const baseline=[
  {id:'personal',name:'개인',email:'personal@example.com',plan:'Pro',workspace:'Personal',five:32,week:61,fiveLeft:'2시간 18분 후',weekLeft:'3일 4시간 후',fiveDate:'9월 16일 19:18 KST',weekDate:'9월 19일 21:00 KST',total:'12,840,620',state:'ok'},
  {id:'research',name:'연구',email:'research@example.com',plan:'Plus',workspace:'Personal',five:12,week:28,fiveLeft:'4시간 10분 후',weekLeft:'5일 2시간 후',fiveDate:'9월 16일 21:10 KST',weekDate:'9월 21일 19:00 KST',total:'4,206,810',state:'ok'},
  {id:'work',name:'업무',email:'work@example.com',plan:'Pro',workspace:'Personal',five:100,week:84,fiveLeft:'42분 후',weekLeft:'1일 8시간 후',fiveDate:'9월 16일 17:42 KST',weekDate:'9월 18일 01:00 KST',total:'21,074,200',state:'ok'},
  {id:'backup',name:'보조',email:'backup@example.com',plan:'Plus',workspace:'Personal',five:8,week:19,fiveLeft:'3시간 30분 후',weekLeft:'6일 1시간 후',fiveDate:'9월 16일 20:30 KST',weekDate:'9월 22일 18:00 KST',total:null,state:'auth'}
 ];
 let accounts=structuredClone(baseline),view='all',representative='personal',hideEmail=false,remaining=false,serial=0;
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function status(a){if(a.state==='auth')return ['error','재인증 필요'];if(a.state==='stale')return ['warning','조회 실패'];if(a.state==='reset')return ['warning','리셋 확인 중'];if(a.five===100||a.week===100)return ['warning','한도 도달'];return ['ok','정상 조회'];}
 function stateHTML(a){const [cls,label]=status(a);return `<span class="status ${cls}">${label}</span>`;}
 function fill(v){return `<div class="track"><div class="fill ${v===100?'full':v>=80?'high':''}" style="width:${remaining?100-v:v}%"></div></div>`;}
 function mini(a,kind){const v=a[kind],label=kind==='five'?'5시간':'주간';return `<div class="meterline"><span>${label}</span>${fill(v)}<span class="value">${remaining?100-v:v}% ${remaining?'남음':'사용'}</span></div>`;}
 function render(){
  tabs.innerHTML=[['all','전체'],...accounts.map(a=>[a.id,a.name])].map(([id,name])=>`<button class="tab ${view===id?'active':''}" data-view="${id}" aria-current="${view===id?'page':'false'}">${esc(name)}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.view;toast.textContent='';render();});
  if(view==='settings'){renderSettings();updateBar();return;}
  if(!accounts.length){content.innerHTML='<div class="empty"><b>연결된 계정이 없습니다</b><br>Codex 계정을 추가해 사용량을 확인하세요.</div>';updateBar();return;}
  if(view==='all'){
   const connected=accounts.filter(a=>a.state==='ok').length,auth=accounts.filter(a=>a.state==='auth').length;
   content.innerHTML=`<div class="summary"><span>${accounts.length}개 계정 · 정상 조회 ${connected}${auth?' · 재인증 '+auth:''}</span><span>샘플 17:00</span></div>`+accounts.map(a=>`<article class="accountcard" tabindex="0" role="button" data-account="${a.id}" aria-label="${esc(a.name)} 계정 상세"><div class="cardtitle"><strong>${esc(a.name)}</strong><div class="cardmeta"><span>${a.plan}</span>${stateHTML(a)}<span aria-hidden="true">›</span></div></div>${a.state==='auth'?'<p class="note error">로그인이 만료되었습니다.</p><p class="note">마지막 성공 조회 09:30 · 현재 값 확인 필요</p>':mini(a,'five')+mini(a,'week')+`<div class="resetline"><span>5h: ${a.state==='reset'?'확인 중':a.fiveLeft}</span><span>W: ${a.weekLeft}</span></div>`+(a.state==='stale'?'<p class="note">이전 값 · 마지막 성공 조회 16:20</p>':'')+(a.state==='reset'?'<p class="note">이전 사용률 · 서버 리셋 확인 대기</p>':'')}</article>`).join('');
   content.querySelectorAll('[data-account]').forEach(c=>{const open=()=>{view=c.dataset.account;render();};c.onclick=open;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};});
  } else {
   const a=accounts.find(a=>a.id===view);if(!a){view='all';render();return;}
   content.innerHTML=`<div class="detailhead"><div class="detailtitle">${esc(a.name)}<span class="plan">${a.plan}</span></div><div class="identity">${hideEmail?'••••@example.com':esc(a.email)} · ${a.workspace}</div><div class="detailstate">${stateHTML(a)}<span>마지막 성공 ${a.state==='auth'?'09:30':a.state==='stale'?'16:20':a.state==='reset'?'16:55':'17:00'}</span></div></div>`;
   if(a.state==='auth'){content.innerHTML+='<div class="banner">계정을 다시 연결해 현재 사용량을 확인하세요.</div><button class="refresh" id="reauth">재인증 시뮬레이션</button>';document.getElementById('reauth').onclick=()=>{a.state='ok';toast.textContent='샘플 연결을 복구했습니다. 실제 로그인은 수행하지 않았습니다.';render();};}
   else {
    if(a.state==='stale'||a.state==='reset')content.innerHTML+=`<div class="banner">${a.state==='stale'?'조회에 실패했습니다. 아래 미터는 이전 값입니다.':'리셋 시각이 지났습니다. 새 사용량 확인 전까지 이전 값을 표시합니다.'}</div>`;
    for(const [kind,label] of [['five','5시간'],['week','주간']]){const v=a[kind];content.innerHTML+=`<div class="window"><div class="windowtitle"><span>${label}</span><strong>${remaining?100-v:v}% <span style="font-size:12px;font-weight:400;letter-spacing:0">${remaining?'남음':'사용'}</span></strong></div>${fill(v)}<div class="windowdata"><span>${remaining?v+'% 사용':100-v+'% 남음'}</span><span>${a.state==='reset'&&kind==='five'?'리셋 확인 중':a[kind+'Left']+' 리셋'}</span></div><div class="absolute">${a[kind+'Date']}</div></div>`;}
    content.innerHTML+=`<div class="activity"><div class="activitytitle">누적 토큰</div>${a.total?`<div class="total">${a.total} <span>tokens</span></div><div class="note">서버 제공 활동 집계 · 샘플</div><div class="activitybars" role="img" aria-label="샘플 최근 7일 토큰 활동"><span style="height:18%"></span><span style="height:60%"></span><span style="height:42%"></span><span style="height:82%"></span><span style="height:50%"></span><span style="height:100%"></span><span style="height:65%"></span></div><div class="chartlabels"><span>9월 10일</span><span>최근 7일</span><span>9월 16일</span></div>`:'<p class="note">제공되지 않음</p>'}</div>`;
   }
  }updateBar();
 }
 function updateBar(){const a=accounts.find(a=>a.id===representative);document.getElementById('bar-label').textContent=a&&a.state!=='auth'?`5h ${a.five}% · W ${a.week}%${a.state!=='ok'?' · 이전 값':''}`:'Codex';root.querySelector('.badge').hidden=!accounts.some(a=>a.state!=='ok');}
 function renderSettings(){
  content.innerHTML='<div class="detailtitle" style="padding:0 4px 14px">설정 · 목업</div>'+accounts.map(a=>`<div class="settingrow manage"><strong class="managedname">${esc(a.name)}</strong>${stateHTML(a)}<button data-remove="${a.id}" aria-label="${esc(a.name)} 샘플 계정 제거">제거</button></div>`).join('')+`<div class="settingrow"><label for="rep">메뉴 막대 대표 계정</label><select id="rep">${accounts.map(a=>`<option value="${a.id}" ${a.id===representative?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="settingrow"><label for="interval">자동 갱신</label><select id="interval"><option>수동</option><option>1분</option><option>2분</option><option selected>5분</option><option>15분</option></select></div><div class="settingrow"><label for="remaining">남은 비율로 미터 표시</label><input id="remaining" type="checkbox" ${remaining?'checked':''}></div><div class="settingrow"><label for="emailhide">이메일 가리기</label><input id="emailhide" type="checkbox" ${hideEmail?'checked':''}></div><div class="settingrow"><label for="launch">로그인 시 실행</label><input id="launch" type="checkbox"></div><p class="note" style="padding:8px 4px">설정은 목업 내에서만 적용됩니다.</p>`;
  content.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{accounts=accounts.filter(a=>a.id!==b.dataset.remove);if(!accounts.some(a=>a.id===representative))representative=accounts[0]?.id;toast.textContent='샘플 계정을 제거했습니다.';render();});
  document.getElementById('rep').onchange=e=>{representative=e.target.value;updateBar();};document.getElementById('remaining').onchange=e=>remaining=e.target.checked;document.getElementById('emailhide').onchange=e=>hideEmail=e.target.checked;
 }
 document.getElementById('settings').onclick=document.getElementById('manage').onclick=()=>{view='settings';toast.textContent='';render();};
 document.getElementById('refresh').onclick=()=>{toast.textContent='샘플 화면을 갱신했습니다. 실제 사용량 조회는 수행하지 않습니다.';render();};
 document.getElementById('theme').onclick=e=>{root.classList.toggle('dark');e.target.textContent=root.classList.contains('dark')?'라이트 모드':'다크 모드';};
 document.getElementById('scenario').onchange=e=>{accounts=e.target.value==='empty'?[]:structuredClone(baseline);if(e.target.value!=='mixed')accounts.forEach(a=>a.state='ok');if(e.target.value==='stale')accounts[1].state='stale';if(e.target.value==='reset'){accounts[0].state='reset';accounts[0].fiveDate='9월 16일 16:58 KST';}view='all';representative=accounts[0]?.id;toast.textContent='';render();};
 const popover=document.getElementById('popover'),bar=document.getElementById('bar-toggle');function setOpen(open){popover.hidden=!open;bar.setAttribute('aria-expanded',String(open));bar.setAttribute('aria-label','Codex 사용량 팝오버 '+(open?'닫기':'열기'));}
 bar.onclick=()=>setOpen(popover.hidden);
 const dialog=document.getElementById('dialog'),alias=document.getElementById('alias');let previousFocus;
 const closeDialog=()=>{dialog.hidden=true;previousFocus?.focus();};
 document.getElementById('add').onclick=()=>{previousFocus=document.activeElement;dialog.hidden=false;alias.value='';alias.focus();};
 document.getElementById('cancel').onclick=closeDialog;
 dialog.onclick=e=>{if(e.target===dialog)closeDialog();};
 document.getElementById('addform').onsubmit=e=>{e.preventDefault();const name=alias.value.trim();if(!name){alias.focus();return;}const a={...baseline[1],id:'sample-'+(++serial),name,email:'sample'+serial+'@example.com',five:0,week:0,total:null,state:'ok'};accounts.push(a);if(!representative)representative=a.id;view=a.id;closeDialog();toast.textContent='가상 계정을 추가했습니다.';render();};
 document.getElementById('status').onclick=()=>{toast.textContent='실제 앱에서 status.openai.com을 엽니다. 목업은 외부 통신을 하지 않습니다.';};
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!dialog.hidden)closeDialog();else{setOpen(false);bar.focus();}}if(e.key==='Tab'&&!dialog.hidden){const nodes=[...dialog.querySelectorAll('input,button')];if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0].focus();}}});
 render();
})();
</script>
</body>
</html>
